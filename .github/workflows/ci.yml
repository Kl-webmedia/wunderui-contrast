name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Run against the shadcn v4 fixture (expected to report findings)
        run: node bin/wunderui-contrast.mjs --cwd test/fixtures/shadcn-v4 || test $? -eq 1
