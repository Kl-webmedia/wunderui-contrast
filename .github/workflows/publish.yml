name: Publish to npm
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Publish with npm Trusted Publishing (no token; provenance is automatic)
        run: |
          npm install -g npm@latest
          set +e
          npm publish --access public > publish.log 2>&1
          code=$?
          cat publish.log
          if [ $code -ne 0 ]; then grep -E "npm error|ERR" publish.log | head -8 | while read -r l; do echo "::error::$l"; done; exit $code; fi
